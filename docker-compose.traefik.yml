# Traefik must define the backup-mtls TLS option with clientAuthType RequestClientCert.
# Set the values referenced below in an environment file outside version control.
name: backup-platform
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_DB: backup_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - ${DATA_DIR:?set DATA_DIR}/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d backup_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: backup-platform-api:local
    build:
      context: ./backup-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      BACKUP_PLATFORM_CONNECTION_STRING: Host=postgres;Port=5432;Database=backup_platform;Username=postgres;Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      AgentDistribution__PackagesDirectory: /app/agent-dist
      AgentDistribution__PublicBaseUrl: https://${PUBLIC_HOST:?set PUBLIC_HOST}
      Authentication__TrustedProxies__0: ${TRAEFIK_IP:?set TRAEFIK_IP}
      Authentication__ClientCertificateHeader__Name: X-Forwarded-Tls-Client-Cert
      Authentication__ClientCertificateHeader__Format: Traefik
      AgentSecurity__Mtls__Enabled: "true"
      AgentSecurity__Mtls__IssuerPfxPath: /run/agent-ca/issuer.pfx
      AGENT_MTLS_ISSUER_PASSWORD: ${AGENT_MTLS_ISSUER_PASSWORD:?set AGENT_MTLS_ISSUER_PASSWORD}
      Secrets__DataProtection__KeysDirectory: /app/dp-keys
      Secrets__DataProtection__CertificatePath: /run/data-protection/certificate.pfx
      Secrets__DataProtection__CertificatePassword: ${DATA_PROTECTION_CERT_PASSWORD:?set DATA_PROTECTION_CERT_PASSWORD}
      GoogleDrive__ClientId: ${GOOGLE_CLIENT_ID:-}
      GoogleDrive__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      GoogleDrive__RedirectUri: ${GOOGLE_REDIRECT_URI:-}
      GoogleDrive__FrontendOrigin: https://${PUBLIC_HOST}
      GoogleDrive__StagingDirectory: /app/gdrive-staging
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${DATA_DIR}/dp-keys:/app/dp-keys
      - ${DATA_DIR}/gdrive-staging:/app/gdrive-staging
      - ${DATA_DIR}/issuer.pfx:/run/agent-ca/issuer.pfx:ro
      - ${DATA_DIR}/data-protection.pfx:/run/data-protection/certificate.pfx:ro
    networks: [default, traefik-net]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
      - "traefik.http.routers.backup-api.rule=Host(`${PUBLIC_HOST}`) && (PathPrefix(`/api/`) || PathPrefix(`/hubs/`))"
      - "traefik.http.routers.backup-api.entrypoints=websecure"
      - "traefik.http.routers.backup-api.tls.options=backup-mtls@file"
      - "traefik.http.routers.backup-api.middlewares=protected@file,backup-strip-cert,backup-client-cert"
      - "traefik.http.middlewares.backup-strip-cert.headers.customrequestheaders.X-Forwarded-Tls-Client-Cert="
      - "traefik.http.middlewares.backup-client-cert.passtlsclientcert.pem=true"
      - "traefik.http.middlewares.backup-strip-cert.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.services.backup-api.loadbalancer.server.port=5000"

  bootstrap:
    profiles: ["bootstrap"]
    image: backup-platform-api:local
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      BACKUP_PLATFORM_CONNECTION_STRING: Host=postgres;Port=5432;Database=backup_platform;Username=postgres;Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      Secrets__DataProtection__CertificatePath: /run/data-protection/certificate.pfx
      Secrets__DataProtection__CertificatePassword: ${DATA_PROTECTION_CERT_PASSWORD:?set DATA_PROTECTION_CERT_PASSWORD}
      BACKUP_PLATFORM_BOOTSTRAP_LOGIN: ${BOOTSTRAP_ADMIN_LOGIN:-}
      BACKUP_PLATFORM_BOOTSTRAP_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BACKUP_PLATFORM_BOOTSTRAP_DISPLAY_NAME: ${BOOTSTRAP_ADMIN_NAME:-}
      BACKUP_PLATFORM_BOOTSTRAP_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
    command: ["--bootstrap-user"]
    volumes:
      - ${DATA_DIR}/data-protection.pfx:/run/data-protection/certificate.pfx:ro
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m

  frontend:
    image: backup-platform-frontend:local
    build:
      context: ./backup-frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 64m
    entrypoint: ["nginx", "-g", "daemon off;"]
    volumes:
      - ./backup-frontend/nginx.traefik.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [traefik-net]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
      - "traefik.http.routers.backup-ui.rule=Host(`${PUBLIC_HOST}`) && !PathPrefix(`/api/`) && !PathPrefix(`/hubs/`)"
      - "traefik.http.routers.backup-ui.entrypoints=websecure"
      - "traefik.http.routers.backup-ui.tls.options=backup-mtls@file"
      - "traefik.http.routers.backup-ui.middlewares=protected@file"
      - "traefik.http.services.backup-ui.loadbalancer.server.port=80"

networks:
  traefik-net:
    external: true
