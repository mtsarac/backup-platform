name: E2E

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'
  pull_request:
    paths: ['.github/workflows/e2e.yml']

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright ${{ matrix.slice }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - slice: S1
            stack: auth
            state: .state-auth.json
            frontend: 6273
            api: 6352
            specs: tests/s1
          - slice: S2
            stack: s2
            state: .state-s2.json
            frontend: 7473
            api: 7552
            specs: tests/s2
          - slice: S5
            stack: s5
            state: .state-s5.json
            frontend: 7273
            api: 7352
            specs: tests/s5 tests/s5-real
    env:
      PUBLIC_HOST: localhost
      E2E_STATE_FILE: ${{ matrix.state }}
      E2E_BASE_URL: https://localhost:${{ matrix.frontend }}
      E2E_API_URL: https://localhost:${{ matrix.api }}
      E2E_MAILPIT_URL: http://127.0.0.1:8026
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.x
      - name: Install dependencies and Chromium
        working-directory: e2e
        run: |
          bun install --frozen-lockfile
          bunx playwright install chromium --with-deps
          echo "CHROMIUM_PATH=$(bun -e "import { chromium } from '@playwright/test'; console.log(chromium.executablePath())")" >> "$GITHUB_ENV"
      - name: Prepare S2 lab address
        if: matrix.slice == 'S2'
        run: sudo ip address add 192.168.122.1/32 dev lo
      - name: Start stack and seed
        run: bash e2e/${{ matrix.stack }}-stack.sh
      - name: Playwright
        working-directory: e2e
        run: bun run test ${{ matrix.specs }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-${{ matrix.slice }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
