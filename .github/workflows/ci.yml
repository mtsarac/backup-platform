name: Fast CI

on:
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  backend:
    name: Backend
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backup-backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # Central package management, no packages.lock.json: use the official cache action.
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backup-backend/Directory.Packages.props', 'backup-backend/Directory.Build.props', 'backup-backend/dotnet-tools.json', 'backup-backend/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Restore
        run: dotnet restore BackupPlatform.sln
      - name: Release build (warnings as errors)
        run: dotnet build BackupPlatform.sln -c Release --no-restore -p:ContinuousIntegrationBuild=true -warnaserror
      - name: Unit tests
        run: dotnet test tests/unit-tests -c Release --no-build
      - name: Architecture tests
        run: dotnet test tests/architecture-tests -c Release --no-build
      # Connectivity timing/acceptance tests remain available locally, but do not gate routine PRs.
      - name: Fast agent tests
        run: >
          dotnet test tests/agent-tests -c Release --no-build
          --filter "FullyQualifiedName!~ConnectivityServiceTests"
          -- xUnit.MaxParallelThreads=2

  integration:
    name: Integration
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BACKUP_PLATFORM_TEST_POSTGRES_TOOLS_DIRECTORY: /usr/lib/postgresql/18/bin
      BACKUP_PLATFORM_TEST_POSTGRES_OLD_TOOLS_DIRECTORY: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.x
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backup-backend/Directory.Packages.props', 'backup-backend/Directory.Build.props', 'backup-backend/dotnet-tools.json', 'backup-backend/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Install PostgreSQL clients
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc > /dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18 postgresql-client-16
      - name: Install browser dependencies
        working-directory: backup-frontend
        run: |
          bun install --frozen-lockfile
          bunx playwright-core install chromium --with-deps
          echo "CHROMIUM_PATH=$(bun -e "import { chromium } from 'playwright-core'; console.log(chromium.executablePath())")" >> "$GITHUB_ENV"
      - name: Integration tests
        working-directory: backup-backend
        run: dotnet test tests/integration-tests -c Release -- xUnit.MaxParallelThreads=4

  e2e-static:
    name: E2E typecheck and lint
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.x
      - run: bun install --frozen-lockfile
        working-directory: backup-frontend
      - run: bun install --frozen-lockfile
        working-directory: e2e
      - name: Typecheck
        working-directory: e2e
        run: ../backup-frontend/node_modules/.bin/tsc --noEmit --skipLibCheck --target esnext --module esnext --moduleResolution bundler --types bun *.ts tests/*/*.ts tests/*.ts
      - name: Lint
        working-directory: e2e
        run: ../backup-frontend/node_modules/.bin/oxlint .

  frontend:
    name: Frontend
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backup-frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.x
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('backup-frontend/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Tests
        run: bun run test
      - name: Production build
        run: bun run build
