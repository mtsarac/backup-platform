name: Release

on:
  # Publishing is paused during pre-v1 development. Manual runs build archives without publishing, even when dispatched on a tag.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # Fast CI includes integration tests; Windows validation and E2E remain separate.
  ci:
    name: Fast CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      publish: ${{ steps.resolve.outputs.publish }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$EVENT_NAME" = push ] && [ "$REF_TYPE" = tag ]; then
            version="${REF_NAME#v}"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Tag '$REF_NAME' is not vMAJOR.MINOR.PATCH[-prerelease]."
              exit 1
            fi
            tag="$REF_NAME"
            publish=true
            if [[ "$version" == *-* ]]; then prerelease=true; else prerelease=false; fi
          else
            version="0.0.0-dryrun.${RUN_NUMBER}"
            tag=""
            publish=false
            prerelease=true
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "publish=$publish"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "Version: $version" >> "$GITHUB_STEP_SUMMARY"

  package:
    name: Package ${{ matrix.component }}
    needs: [ci, version]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        component: [agent-win-x64, agent-linux-x64, backend-linux-x64, frontend]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        if: ${{ matrix.component != 'frontend' }}
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v6
        if: ${{ matrix.component != 'frontend' }}
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backup-backend/Directory.Packages.props', 'backup-backend/Directory.Build.props', 'backup-backend/Directory.Build.targets', 'backup-backend/dotnet-tools.json', 'backup-backend/**/*.csproj', 'backup-backend/**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # oven-sh/setup-bun v2.2.0, pinned to its commit.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        if: ${{ matrix.component == 'frontend' }}
        with:
          bun-version: 1.4.x

      - uses: actions/cache@v6
        if: ${{ matrix.component == 'frontend' }}
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('backup-frontend/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Build archive
        env:
          COMPONENT: ${{ matrix.component }}
          VERSION: ${{ needs.version.outputs.version }}
        run: .github/scripts/package-release.sh "$COMPONENT" "$VERSION" release-out

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.component }}
          path: release-out/*
          retention-days: 14
          if-no-files-found: error

  # Inno Setup only runs on Windows, so the wizard is built outside the Linux package matrix.
  setup-wizard:
    name: Package Windows setup wizard
    needs: [ci, version]
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Inno Setup 6.7.3 from the unofficial Tools.InnoSetup NuGet package (the vendor installer is not on a stable URL); pinned by hash.
      - name: Fetch Inno Setup compiler
        run: |
          Invoke-WebRequest https://api.nuget.org/v3-flatcontainer/tools.innosetup/6.7.3/tools.innosetup.6.7.3.nupkg -OutFile inno.zip
          if ((Get-FileHash inno.zip -Algorithm SHA256).Hash -ne 'F780898E402FF80612CC8D9FCB8C6E02932BD1CB4C900FFDAA31F9341CFB49F4') { throw 'Inno Setup package hash mismatch.' }
          Expand-Archive inno.zip inno

      - name: Build setup wizard
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # The file version must be numeric; the full semantic version stays in the product version and the file name.
          $fileVersion = ($env:VERSION -split '-')[0] + '.0'
          & inno/tools/ISCC.exe "/DAppVersion=$env:VERSION" "/DFileVersion=$fileVersion" "/Fbackup-agent-win-x64-setup-$env:VERSION" /Orelease-out backup-backend/deploy/windows/installer/BackupAgentSetup.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - uses: actions/upload-artifact@v7
        with:
          name: release-agent-win-x64-setup
          path: release-out/*
          retention-days: 14
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [version, package, setup-wizard]
    if: ${{ needs.version.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: release-files

      - name: Checksums
        working-directory: release-files
        run: |
          sha256sum backup-* > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          ls -l

      - name: Create release (draft, upload, publish)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          cat > notes.md <<EOF
          ## Backup Platform ${VERSION}

          | Archive | Contents |
          |---|---|
          | \`backup-agent-win-x64-${VERSION}.zip\` | Windows Agent (self-contained) with service install/uninstall scripts |
          | \`backup-agent-win-x64-setup-${VERSION}.exe\` | Windows setup wizard: asks only for the one-time enrollment key and the computer name. Not code-signed, so SmartScreen warns. Serve it from the backend as \`backup-agent-win-x64-setup.exe\` in the packages directory; the backend adds its server address on download. |
          | \`backup-agent-linux-x64-${VERSION}.tar.gz\` | Linux Agent (self-contained). **No official installer or systemd unit yet.** |
          | \`backup-backend-linux-x64-${VERSION}.tar.gz\` | Backend API (self-contained) with the PostgreSQL migration script |
          | \`backup-frontend-${VERSION}.tar.gz\` | Static web UI; serve it on the same origin as the backend |

          Verify downloads: \`sha256sum --check SHA256SUMS.txt\`. The binaries are not code-signed.
          Agent enrollment uses the \`BackupPlatform.Agent.Host enroll\` CLI and the web wizard (Windows service or Linux owner-only store).
          EOF
          args=(--repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$TAG" --notes-file notes.md --generate-notes)
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
          gh release create "$TAG" "${args[@]}" release-files/*
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
