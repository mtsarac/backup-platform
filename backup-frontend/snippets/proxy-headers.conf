proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# Replace, never append: the API only trusts this proxy, so a client-supplied X-Forwarded-For must not reach it.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
# Strip whatever the client sent and rewrite from the TLS handshake (empty when no certificate: nginx then omits the header).
proxy_set_header X-Client-Cert $ssl_client_escaped_cert;
