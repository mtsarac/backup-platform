server {
    listen 80;
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    # Agents may present a client certificate; nginx only requests it (no chain check). The API validates it against its own CA and trusts the forwarded copy solely from this proxy.
    ssl_verify_client optional_no_ca;

    # Automatic redirect from HTTP to HTTPS on whichever port is hit
    error_page 497 301 =307 https://$http_host$request_uri;

    include /etc/nginx/snippets/security-headers.conf;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Publishing an agent release uploads the package (up to 256 MiB, base64 in JSON); nginx's default 1 MiB body limit would refuse every publish.
    location = /api/platform/agent-updates {
        client_max_body_size 360m;
        proxy_pass http://api:5000;
        proxy_http_version 1.1;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    location /api/ {
        proxy_pass http://api:5000/api/;
        proxy_http_version 1.1;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    location /hubs/ {
        proxy_pass http://api:5000/hubs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_read_timeout 1h;
        proxy_cache_bypass $http_upgrade;
    }
}
