# e2e-only: let the api container trust the self-signed MinIO certificate (S3 connections must be https), and add the Central-storage, agent-mTLS and agent self-update lab wiring.
services:
  api:
    # List form because the Central tenant-scope key embeds E2E_TENANT_A, the tenant id as 32 hex digits because sh drops env names with '-' (compose interpolates values, not map keys). scripts/e2e/lab-central-mtls.py writes it to .env.e2e.
    environment:
      - SSL_CERT_FILE=/etc/ssl/e2e-ca-bundle.pem
      - Backups__Retention__MinimumKeepFor=00:00:30
      - Backups__Retention__MinimumDeleteGracePeriod=00:00:10
      - Notifications__PublicBaseUrl=https://192.168.122.1:5173
      - Notifications__AllowedPrivateNetworks__0=192.168.122.0/24
      # The lab MinIO sits on the host bridge address; without this the API refuses to talk to it (#64).
      - Backups__S3__AllowedPrivateNetworks__0=192.168.122.0/24
      # The notify scenario spends ~15 test sends per run and the product caps a tenant at 20 per hour; the per-channel cap (5) is what the scenario asserts.
      - Notifications__TestNotificationsPerTenantPerHour=1000
      # Every flag the API reads; scripts/e2e/flags.py flips them one at a time through the E2E_FEATURE_* variables (defaults are the product defaults).
      - Features__sms=${E2E_FEATURE_SMS:-false}
      - Features__smb=${E2E_FEATURE_SMB:-false}
      - Features__sizeAnomaly=${E2E_FEATURE_SIZEANOMALY:-false}
      - Features__externalSecrets=${E2E_FEATURE_EXTERNALSECRETS:-false}
      - Features__replicaRepair=${E2E_FEATURE_REPLICAREPAIR:-true}
      - Secrets__Provider=${E2E_SECRETS_PROVIDER:-Database}
      - Secrets__Vault__Endpoint=https://${PUBLIC_HOST:-192.168.122.1}:8200
      - VAULT_TOKEN=${E2E_VAULT_TOKEN:-}
      # Central (platform-managed) storage: the share is also mounted on the Fedora agent (configure-agents.py), so agent and backend see one tree.
      - Backups__Storage__Central__RootDirectory=/central-share/central
      - Backups__Storage__Central__TenantScopes__${E2E_TENANT_A:-00000000000000000000000000000001}=e2e-a
      # Agent mTLS needs Kestrel to terminate TLS itself (client certificates from a proxy are not trusted): a second, https endpoint on 5001 published as :5253.
      - ASPNETCORE_URLS=http://+:5000;https://+:5001
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/etc/e2e-tls/cert.pem
      - ASPNETCORE_Kestrel__Certificates__Default__KeyPath=/etc/e2e-tls/key.pem
      - AgentSecurity__Mtls__Enabled=true
      - AgentSecurity__Mtls__IssuerPfxPath=/etc/e2e-mtls/issuer.pfx
      - AGENT_MTLS_ISSUER_PASSWORD=${E2E_MTLS_ISSUER_PASSWORD:-unset}
      # Agent self-update: the public key release manifests must verify against (scripts/e2e/lab-selfupdate.py writes it; empty = no key trusted).
      - AgentUpdates__TrustedKeys__e2e=${E2E_UPDATE_PUBLIC_KEY:-}
    ports:
      - "${PUBLIC_HOST:-192.168.122.1}:5253:5001"
    volumes:
      - ./docs/test-environment/certs/ca-bundle.pem:/etc/ssl/e2e-ca-bundle.pem:ro
      - ./docs/test-environment/certs/mtls:/etc/e2e-mtls:ro
      - frontend_certs:/etc/e2e-tls:ro
      - samba_data:/central-share

volumes:
  samba_data:
    external: true
    name: bpe2e-targets_samba_data
